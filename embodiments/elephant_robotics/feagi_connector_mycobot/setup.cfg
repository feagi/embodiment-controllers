[metadata]
name = feagi_connector_mycobot
version = 0.0.1
author = Neuraville INC
author_email = feagi@neuraville.com
description = Feagi agent mycobot to connect feagi with your cobot arm
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/feagi/embodiment-controllers
project_urls =
  Bug Tracker = https://github.com/feagi/embodiment-controllers/issues
classifiers =
  Programming Language :: Python :: 3 :: Only
  License :: OSI Approved :: Apache Software License
  Operating System :: OS Independent

[options]
package_dir =
  = .
packages = find:
python_requires = >=3.6
install_requires =
    feagi_connector
    pymycobot
    zmq>=0.0.0; python_version<"3.8"

[options.packages.find]
where = .

[options.package_data]
feagi_connector_mycobot =
    setup.sh
    requirements.txt
    networking.json
    capabilities.json
