[metadata]
name = feagi_connector_video_capture
version = 0.0.1
author = Neuraville INC
author_email = info@neuraville.com
description = Feagi agent video capture to connect feagi with your video capture
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/feagi/feagi
project_urls =
  Bug Tracker = https://github.com/feagi/feagi/issues
classifiers =
  Programming Language :: Python :: 3 :: Only
  License :: OSI Approved :: Apache Software License
  Operating System :: OS Independent

[options]
package_dir =
  = .
packages = find:
python_requires = >=3.6
install_requires =
    feagi_connector
    Pillow==10.1.0
    mss==9.0.1
    screeninfo==0.8.1

[options.packages.find]
where = .
